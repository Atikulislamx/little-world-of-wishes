<!DOCTYPE html>
<html lang="en" data-page="celebration" data-ambient="petals sparkles">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#483449">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Happy Birthday — tap the candles, make a wish and celebrate the day.">
  <title>Happy Birthday · Little World of Wishes</title>

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/backgrounds/festival-glow-sm.webp" as="image" type="image/webp" media="(max-width: 900px)">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="js/config.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/art.js" defer></script>
  <script src="js/shell.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/music.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/flowers.js" defer></script>
  <script src="js/letter.js" defer></script>
  <script src="js/dreams.js" defer></script>
  <script src="js/surprises.js" defer></script>
  <script src="js/finale.js" defer></script>
  <script src="js/cake.js" defer></script>
  <script src="js/router.js" defer></script>
</head>

<body class="page page--celebration page--on-dark">
  <a class="skip-link" href="#main">Skip to the celebration</a>

  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__veil"></div>
  </div>
  <canvas class="ambient-canvas" aria-hidden="true"></canvas>
  <div class="balloon-field" data-balloons aria-hidden="true"></div>
  <div class="progress-rail" role="progressbar" aria-label="Journey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-rail__fill"></div></div>

  <header class="topbar" data-topbar></header>

  <main class="page__main" id="main">
    <div class="celebration-hero">
      <div class="celebration-card">
        <div class="celebration-hero__head">
          <p class="eyebrow eyebrow--centered" style="color:#ffe6c4">The day itself</p>
          <h1 class="celebration-hero__heading">Happy Birthday!</h1>
        </div>
        <div class="celebration-hero__copy">
          <p class="celebration-hero__date">
            <span aria-hidden="true" data-icon="cake"></span>
            <span data-date="display">November 19, 2026</span>
          </p>
          <p class="celebration-hero__body">
            Today is all about celebrating you and the wonderful person you continue to become.
          </p>
        </div>
      </div>

      <div class="cake-stage" data-cake-stage>
        <span class="cake-stage__halo" aria-hidden="true"></span>
        <div data-cake></div>
      </div>

      <div class="cake-stage__checklist">
        <p class="cake-hint" data-cake-hint>
          <span aria-hidden="true" data-icon="flame"></span>
          <span>Five little candles, one quiet wish — tap each flame.</span>
        </p>
        <p class="celebration-toast" data-cake-message role="status" aria-live="polite"></p>
        <p class="candle-counter" data-candle-counter>5 candles still glowing</p>
      </div>

      <div class="cluster cluster--center">
        <button class="btn btn--ghost" type="button" data-cake-again hidden>
          <span aria-hidden="true" data-icon="flame"></span>
          Light them again
        </button>
        <a class="btn btn--primary btn--lg" href="garden.html" data-nav>
          Explore Your Garden
          <span class="btn__arrow" aria-hidden="true" data-icon="arrowRight"></span>
        </a>
      </div>
    </div>
  </main>

  <footer class="page-foot" data-footer></footer>

  <noscript>
    <p class="noscript-note">This little world needs JavaScript for the candle magic.</p>
  </noscript>
</body>
</html>
