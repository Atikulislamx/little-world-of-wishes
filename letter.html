<!DOCTYPE html>
<html lang="en" data-page="letter" data-ambient="petals sparkles">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A little note, waiting inside a sealed envelope.">
  <title>A Little Note · Little World of Wishes</title>

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/klee-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/backgrounds/letter-desk-sm.webp" as="image" type="image/webp" media="(max-width: 900px)">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="js/config.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/art.js" defer></script>
  <script src="js/shell.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/music.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/cake.js" defer></script>
  <script src="js/flowers.js" defer></script>
  <script src="js/dreams.js" defer></script>
  <script src="js/surprises.js" defer></script>
  <script src="js/finale.js" defer></script>
  <script src="js/letter.js" defer></script>
  <script src="js/router.js" defer></script>
</head>

<body class="page page--letter">
  <a class="skip-link" href="#main">Skip to the letter</a>

  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__veil"></div>
  </div>
  <canvas class="ambient-canvas" aria-hidden="true"></canvas>
  <div class="progress-rail" role="progressbar" aria-label="Journey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-rail__fill"></div></div>

  <header class="topbar" data-topbar></header>

  <main class="page__main" id="main">
    <div class="letter-wrap">
      <header class="letter-head">
        <p class="eyebrow eyebrow--centered reveal">A little note</p>
        <h1 class="letter-head__title halo">Something I <em>Wanted to Say</em></h1>
        <p class="letter-head__intro reveal">
          A letter was left here for you. Take a breath, then open it.
        </p>
      </header>

      <div class="letter-stage" data-letter-stage>
        <div class="letter-stage__envelope envelope-stage">
          <div class="envelope-scene">
            <div class="envelope" data-envelope tabindex="0" role="button" aria-label="Open your letter">
              <div class="envelope__back" aria-hidden="true"></div>
              <div class="envelope__letter" aria-hidden="true">
                <div class="envelope__letter-lines">
                  <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                </div>
              </div>
              <div class="envelope__front" aria-hidden="true"></div>
              <div class="envelope__flap" aria-hidden="true"></div>
              <div class="envelope__seal" aria-hidden="true" data-icon="flower"></div>
              <span class="envelope__label" aria-hidden="true">for you</span>
            </div>
            <div class="envelope__shadow" aria-hidden="true"></div>
          </div>

          <div class="letter-actions">
            <button class="btn btn--primary btn--lg" type="button" data-letter-open aria-expanded="false" aria-controls="letter-sheet">
              Open Your Letter
              <span class="btn__arrow" aria-hidden="true" data-icon="envelope"></span>
            </button>
            <button class="btn btn--ghost" type="button" data-letter-close hidden>
              <span aria-hidden="true" data-icon="close"></span>
              Fold the letter
            </button>
          </div>
        </div>

        <div class="letter-stage__sheet">
          <article class="letter-sheet" id="letter-sheet" data-letter-sheet aria-hidden="true" aria-labelledby="letter-title">
            <h2 class="sr-only" id="letter-title">A note for your birthday</h2>
            <div data-letter-body></div>
          </article>
        </div>

        <div class="letter-butterflies" data-letter-butterflies aria-hidden="true"></div>
      </div>

      <div class="letter-actions" style="margin-top:clamp(1rem,3vw,2rem)">
        <a class="btn btn--primary btn--lg" href="dreams.html" data-nav>
          Continue to Your Dreams
          <span class="btn__arrow" aria-hidden="true" data-icon="arrowRight"></span>
        </a>
      </div>
    </div>
  </main>

  <footer class="page-foot" data-footer></footer>

  <noscript>
    <p class="noscript-note">The letter needs JavaScript to unfold.</p>
  </noscript>
</body>
</html>
