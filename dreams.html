<!DOCTYPE html>
<html lang="en" data-page="dreams" data-ambient="sparkles petals">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Five little doors into a beautiful future — dreams and destinations.">
  <title>Dreams &amp; Destinations · Little World of Wishes</title>

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/backgrounds/dreams-sky-sm.webp" as="image" type="image/webp" media="(max-width: 900px)">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="js/config.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/art.js" defer></script>
  <script src="js/shell.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/music.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/cake.js" defer></script>
  <script src="js/flowers.js" defer></script>
  <script src="js/letter.js" defer></script>
  <script src="js/surprises.js" defer></script>
  <script src="js/finale.js" defer></script>
  <script src="js/dreams.js" defer></script>
  <script src="js/router.js" defer></script>
</head>

<body class="page page--dreams">
  <a class="skip-link" href="#main">Skip to the dreams</a>

  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__veil"></div>
    <div class="backdrop__tint"></div>
  </div>
  <canvas class="ambient-canvas" aria-hidden="true"></canvas>
  <div class="progress-rail" role="progressbar" aria-label="Journey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-rail__fill"></div></div>
  <div data-dreams-sky aria-hidden="true" style="position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden"></div>

  <header class="topbar" data-topbar></header>

  <main class="page__main" id="main">
    <header class="dreams-head">
      <p class="eyebrow eyebrow--centered reveal" data-bind-text="dreams.eyebrow">Dreams &amp; destinations</p>
      <h1 class="dreams-head__title halo" data-core-bind="dreams.heading" data-core-rich="1">A Beautiful <em>Future Waits</em></h1>
      <p class="dreams-head__body reveal">
        <span data-core-bind="dreams.body">Five little doors into what is coming for you. Each one is already open.</span>
      </p>
    </header>

    <section class="dream-grid" data-dreams-grid aria-label="Five wishes for your future"></section>

    <div class="dreams-foot">
      <a class="btn btn--primary btn--lg" href="surprise.html" data-nav>
        <span data-core-bind="dreams.cta">Discover Another Surprise</span>
        <span class="btn__arrow" aria-hidden="true" data-icon="arrowRight"></span>
      </a>
      <p class="hand" style="color:var(--ink-muted);font-size:var(--text-base)">
        There is still a little more magic ahead.
      </p>
    </div>

    <div class="dreams-skyline" aria-hidden="true">
      <div data-skyline></div>
    </div>
  </main>

  <footer class="page-foot" data-footer></footer>

  <noscript>
    <p class="noscript-note">This little world needs JavaScript.</p>
  </noscript>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var host = document.querySelector('[data-skyline]');
      if (!host || !window.LWOWArt) return;
      host.innerHTML = window.LWOWArt.mountainLayers();
    });
  </script>
</body>
</html>
