<!DOCTYPE html>
<html lang="en" data-page="surprise" data-ambient="fireflies sparkles">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2C1F36">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Three hidden surprises in a lantern-lit evening garden.">
  <title>A Little Extra Magic · Little World of Wishes</title>

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/backgrounds/evening-magic-sm.webp" as="image" type="image/webp" media="(max-width: 900px)">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="js/config.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/art.js" defer></script>
  <script src="js/shell.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/music.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/cake.js" defer></script>
  <script src="js/flowers.js" defer></script>
  <script src="js/letter.js" defer></script>
  <script src="js/dreams.js" defer></script>
  <script src="js/finale.js" defer></script>
  <script src="js/surprises.js" defer></script>
  <script src="js/router.js" defer></script>
</head>

<body class="page page--surprise page--on-dark">
  <a class="skip-link" href="#main">Skip to the surprises</a>

  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__veil"></div>
  </div>
  <canvas class="ambient-canvas" aria-hidden="true"></canvas>
  <div class="progress-rail" role="progressbar" aria-label="Journey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-rail__fill"></div></div>
  <div data-lanterns aria-hidden="true" style="position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden"></div>

  <header class="topbar" data-topbar></header>

  <main class="page__main" id="main">
    <header class="surprise-head">
      <p class="eyebrow eyebrow--centered reveal" style="color:#ffe0b0">A little extra magic</p>
      <h1 class="surprise-head__title">Three Little <em>Surprises</em></h1>
      <p class="surprise-head__body reveal">
        The lanterns are lit and the fireflies have come out. Something is waiting behind each glow.
      </p>
    </header>

    <section class="surprise-grid" data-surprise-grid aria-label="Three surprises to discover"></section>

    <div class="surprise-progress">
      <span class="surprise-progress__label" data-surprise-progress-label>surprises found</span>
      <span class="surprise-progress__dots" aria-hidden="true">
        <span class="surprise-progress__dot" data-surprise-dot data-key="gift"></span>
        <span class="surprise-progress__dot" data-surprise-dot data-key="star"></span>
        <span class="surprise-progress__dot" data-surprise-dot data-key="butterfly"></span>
      </span>
    </div>

    <div class="surprise-foot">
      <p class="surprise-foot__note" data-surprise-note role="status" aria-live="polite">
        Two more little lights are waiting for you.
      </p>
      <a class="btn btn--primary btn--lg" href="finale.html" data-nav>
        One Last Little Wish
        <span class="btn__arrow" aria-hidden="true" data-icon="arrowRight"></span>
      </a>
    </div>
  </main>

  <footer class="page-foot" data-footer></footer>

  <dialog class="modal modal--dark" data-surprise-modal aria-labelledby="surprise-title">
    <div class="modal__frame">
      <button class="modal__close" type="button" aria-label="Close this surprise">
        <span aria-hidden="true" data-icon="close"></span>
      </button>
      <div class="modal__art" data-surprise-art aria-hidden="true"></div>
      <p class="modal__kicker" data-surprise-kicker>A little surprise</p>
      <h2 class="modal__title" id="surprise-title">For you</h2>
      <p class="modal__body" data-surprise-body></p>
      <p class="modal__count" data-surprise-count></p>
      <div class="modal__actions">
        <button class="btn btn--primary" type="button" data-surprise-close>Lovely</button>
      </div>
    </div>
  </dialog>

  <noscript>
    <p class="noscript-note">The surprises need JavaScript to appear.</p>
  </noscript>
</body>
</html>
